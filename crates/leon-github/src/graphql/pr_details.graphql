fragment prDetails on PullRequest {
  body
  comments(last: 30) { nodes { author { login } body createdAt } }
  reviewThreads(first: 50) { nodes { id isResolved viewerCanResolve path line
    comments(first: 30) { nodes { author { login } body createdAt } }
    hunk: comments(first: 1) { nodes { diffHunk } }
  } }
  commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes {
    __typename
    ... on CheckRun { name status conclusion detailsUrl startedAt
      checkSuite { workflowRun { event workflow { name } } } }
    ... on StatusContext { context state targetUrl }
  } } } } } }
}
