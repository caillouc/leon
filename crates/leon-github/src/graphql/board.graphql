fragment board on Issue {
  projectItems(first: 5, includeArchived: false) { nodes { fieldValues(first: 30) { nodes {
    __typename
    ... on ProjectV2ItemFieldSingleSelectValue {
      name color optionId
      field { ... on ProjectV2SingleSelectField { name options { id } } }
    }
    ... on ProjectV2ItemIssueFieldValue {
      issueFieldValue { ... on IssueFieldSingleSelectValue {
        name color optionId
        field { ... on IssueFieldSingleSelect { name options { id } } }
      } }
    }
    ... on ProjectV2ItemFieldIterationValue {
      title startDate duration
      field { ... on ProjectV2IterationField { name } }
    }
  } } } }
}
