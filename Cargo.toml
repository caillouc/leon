[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo run` starts Leon; CI passes `--workspace` to build and test everything.
default-members = ["crates/leon"]

[workspace.package]
version = "0.9.2"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/caillouc/leon"
publish = false

[workspace.dependencies]
# Leon crates
leon-domain = { path = "crates/leon-domain" }
leon-core = { path = "crates/leon-core" }
leon-config = { path = "crates/leon-config" }
leon-store = { path = "crates/leon-store" }
leon-ui = { path = "crates/leon-ui" }
leon-backends = { path = "crates/leon-backends" }
leon-catalog = { path = "crates/leon-catalog" }
leon-git = { path = "crates/leon-git" }
leon-github = { path = "crates/leon-github" }
leon-app-tools = { path = "crates/leon-app-tools" }

# UI (P1): pinned to one exact snapshot; only `leon-ui` may use them.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
# Tree-sitter syntax colours for diffs, as in Zed (I21): the grammars of
# the languages most code is in.
gpui-component = { version = "=0.10.0", features = [
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-make",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
# The highlighter's text type, at the version gpui-component pins.
ropey = "=2.0.0-beta.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }

# Everything else
anyhow = "1.0.104"
# Images in a message go to Claude Code and Copilot CLI in base64 (I27);
# already in the tree through other crates.
base64 = "0.23.1"
dirs = "7.0.0"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (the only list of exceptions).
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Denied outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
