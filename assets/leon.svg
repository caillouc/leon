<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Leon's icon: Napoleon's bicorne, black felt with gold trim and the
       tricolor cockade, on a dark rounded square (macOS icon grid). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3757"/>
      <stop offset="1" stop-color="#121621"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d36"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7e9cf2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7e9cf2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g transform="translate(0 28)">
  <!-- shadow under the hat -->
  <ellipse cx="512" cy="640" rx="330" ry="30" fill="#000000" fill-opacity="0.35"/>
  <!-- the bicorne, worn sideways: two pointed corners, a low broad crown,
       the lower edge curving up where the head goes -->
  <path d="M140 596 C 230 520 330 384 512 376 C 694 384 794 520 884 596 C 770 618 640 566 512 572 C 384 566 254 618 140 596 Z" fill="url(#felt)"/>
  <!-- gold trim along the crown -->
  <path d="M140 596 C 230 520 330 384 512 376 C 694 384 794 520 884 596" fill="none" stroke="#d9b45a" stroke-width="16" stroke-linecap="round"/>
  <!-- lower edge -->
  <path d="M140 596 C 254 618 384 566 512 572 C 640 566 770 618 884 596" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  <!-- gold loop and tricolor cockade: red, white, blue -->
  <rect x="598" y="404" width="22" height="120" rx="11" fill="#d9b45a"/>
  <circle cx="609" cy="456" r="50" fill="#d6404b"/>
  <circle cx="609" cy="456" r="34" fill="#f4f1ea"/>
  <circle cx="609" cy="456" r="19" fill="#2f4fbf"/>
  </g>
</svg>
