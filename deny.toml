# cargo-deny: licences, security advisories, sources. Run by `cargo xtask ci`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for our direct
# dependencies: transitive ones come from the pinned GPUI snapshot (P1) and are
# reviewed when it is upgraded.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Leon's own crates are AGPL-3.0-only; its dependencies keep to permissive
# licences, all compatible with it.
allow = [
  "AGPL-3.0-only",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
