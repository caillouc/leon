name: Release

# Pushing a version tag (v0.1.0) publishes a GitHub release: Leon's
# notarized .dmg for macOS (Apple Silicon) and the Linux binary. Both are
# built side by side, then published together, so a release always has both.
# Their dependencies come already built from main (release-cache.yml): a tag
# can read main's caches but not another tag's, so it saves none.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      # The Developer ID certificate and its key, in a keychain of this run
      # only.
      - name: Signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Notarization key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "LEON_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          LEON_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LEON_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: cargo xtask release

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/Leon-*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As in ci.yml.
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      - name: Build
        run: cargo build -p leon --release --locked

      - name: Package
        run: tar czf "leon-$GITHUB_REF_NAME-linux-x86_64.tar.gz" -C target/release leon

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: leon-*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Leon $GITHUB_REF_NAME" --generate-notes
