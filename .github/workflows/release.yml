name: Release

# Pushing a version tag (v0.1.0) publishes a GitHub release: Leon's
# notarized .dmg for macOS (Apple Silicon) and the Linux binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The Developer ID certificate and its key, in a keychain of this run
      # only.
      - name: Signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Notarization key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "LEON_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          LEON_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LEON_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: cargo xtask release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/Leon-*.dmg \
            --title "Leon $GITHUB_REF_NAME" --generate-notes

  linux:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As in ci.yml.
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p leon --release --locked

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "leon-$GITHUB_REF_NAME-linux-x86_64.tar.gz" -C target/release leon
          gh release upload "$GITHUB_REF_NAME" "leon-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
